<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conquest Particle Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101216;
        color: #e7ebf2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 10px 14px;
        background: #191d24;
        border-bottom: 1px solid #2b313c;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      button {
        height: 34px;
        padding: 0 12px;
        border: 1px solid #3a4351;
        border-radius: 6px;
        background: #242a34;
        color: #f1f4f8;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover {
        background: #2d3542;
      }

      main {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 0;
      }

      .viewport-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .panel {
        min-height: 0;
        overflow: auto;
        border-left: 1px solid #2b313c;
        background: #151920;
        padding: 12px;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 650;
      }

      .section {
        display: grid;
        gap: 8px;
        padding: 10px 0;
        border-top: 1px solid #28303b;
      }

      .section:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .section-title {
        color: #aeb9c8;
        font-size: 12px;
        font-weight: 650;
        text-transform: uppercase;
      }

      .field {
        display: grid;
        grid-template-columns: minmax(116px, 1fr) 116px;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }

      .field label,
      .check label {
        color: #dbe2ec;
        font-size: 12px;
      }

      input,
      select {
        min-width: 0;
        height: 28px;
        border: 1px solid #36404d;
        border-radius: 4px;
        background: #202630;
        color: #eef3fa;
        font: inherit;
        font-size: 12px;
      }

      input[type="number"] {
        padding: 0 7px;
      }

      input[type="color"] {
        padding: 2px;
      }

      input[type="checkbox"] {
        width: 15px;
        height: 15px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 26px;
      }

      .color-row {
        display: grid;
        grid-template-columns: 34px 1fr 64px;
        align-items: center;
        gap: 8px;
      }

      .color-row span {
        color: #aeb9c8;
        font-size: 12px;
      }

      .hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: grid;
        gap: 6px;
        max-width: min(720px, calc(100vw - 24px));
        pointer-events: none;
      }

      .status,
      .stats {
        width: fit-content;
        max-width: 100%;
        padding: 7px 9px;
        border: 1px solid rgba(111, 125, 146, 0.38);
        border-radius: 6px;
        background: rgba(16, 18, 22, 0.84);
        color: #dbe2ec;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .status.error {
        border-color: rgba(255, 111, 111, 0.55);
        color: #ffb8b8;
      }

      @media (max-width: 680px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) minmax(220px, 40vh);
        }

        .panel {
          border-left: 0;
          border-top: 1px solid #2b313c;
        }

        header {
          align-items: stretch;
          flex-direction: column;
          gap: 10px;
        }

        .toolbar {
          width: 100%;
          margin-left: 0;
          flex-wrap: wrap;
        }

        button {
          flex: 1 1 auto;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Conquest Particle Preview</h1>
      <div class="toolbar">
        <input id="pte-file" type="file" accept=".pte.xml" hidden>
        <button id="open-file" type="button">Open Particle XML</button>
        <button id="load-sample" type="button">Load Sample</button>
        <button id="restart" type="button">Restart</button>
        <button id="reset-view" type="button">Reset View</button>
      </div>
    </header>
    <main>
      <div class="viewport-wrap">
        <canvas id="viewport"></canvas>
        <div class="hud">
          <div id="status" class="status">Open a .pte.xml file or load the sample. Drag to orbit, Shift-drag or middle-drag to pan, mouse wheel to zoom.</div>
          <div id="stats" class="stats">No particle system loaded</div>
        </div>
      </div>
      <aside id="parameter-panel" class="panel">
        <h2>Parameters</h2>
        <div class="status">Load a particle system to inspect and edit values.</div>
      </aside>
    </main>
    <script type="module" src="./particleApp.js"></script>
  </body>
</html>
