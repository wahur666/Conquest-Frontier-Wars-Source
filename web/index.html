<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conquest UTF Mesh Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101216;
        color: #e7ebf2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 10px 14px;
        background: #191d24;
        border-bottom: 1px solid #2b313c;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      button,
      label.toggle {
        height: 34px;
        border: 1px solid #3a4351;
        border-radius: 6px;
        background: #242a34;
        color: #f1f4f8;
        font: inherit;
        font-size: 13px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      button:hover,
      label.toggle:hover {
        background: #2d3542;
      }

      label.toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        cursor: pointer;
        user-select: none;
      }

      input[type="checkbox"] {
        width: 15px;
        height: 15px;
        margin: 0;
      }

      main {
        position: relative;
        min-height: 0;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: grid;
        gap: 6px;
        max-width: min(680px, calc(100vw - 24px));
        pointer-events: none;
      }

      .status,
      .stats {
        width: fit-content;
        max-width: 100%;
        padding: 7px 9px;
        border: 1px solid rgba(111, 125, 146, 0.38);
        border-radius: 6px;
        background: rgba(16, 18, 22, 0.84);
        color: #dbe2ec;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .status.error {
        border-color: rgba(255, 111, 111, 0.55);
        color: #ffb8b8;
      }

      @media (max-width: 680px) {
        header {
          align-items: stretch;
          flex-direction: column;
          gap: 10px;
        }

        .toolbar {
          width: 100%;
          margin-left: 0;
          flex-wrap: wrap;
        }

        button,
        label.toggle {
          flex: 1 1 auto;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Conquest UTF Mesh Viewer</h1>
      <div class="toolbar">
        <input id="utf-file" type="file" accept=".utf,.cmp,.3db,.cmp.xml,.3db.xml,.shield,.shield.xml*/*" hidden>
        <button id="open-file" type="button">Open UTF File</button>
        <button id="reset-view" type="button">Reset View</button>
        <label class="toggle">
          <input id="wireframe" type="checkbox">
          Wireframe
        </label>
      </div>
    </header>
    <main>
      <canvas id="viewport"></canvas>
      <div class="hud">
        <div id="status" class="status">Open a UTF mesh file to begin. Drag to orbit, Shift-drag or middle-drag to pan, mouse wheel to zoom.</div>
        <div id="stats" class="stats">No mesh loaded</div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
